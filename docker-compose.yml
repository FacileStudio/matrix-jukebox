services:
  matrix-jukebox:
    build: 
        context: .
        dockerfile: Dockerfile
    restart: unless-stopped
        
    volumes:
      - jukebox-data:/app/data
    
    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    environment:
      # Set these from Dokploy secrets/environment settings
      MATRIX_SERVER_NAME: ${MATRIX_SERVER_NAME:-}
      MATRIX_USER_NAME: ${MATRIX_USER_NAME:-}
      MATRIX_PASSWORD: ${MATRIX_PASSWORD:-}
      # RUST_LOG: debug  # Uncomment for debug logging
      RUST_BACKTRACE: "1"

volumes:
  jukebox-data:
